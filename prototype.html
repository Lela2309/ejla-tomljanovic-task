/* Monitask prototype: one stylesheet. Sections follow the order the design was built in; later rules refine earlier ones. */

/* ===== Tokens, reset and app shell ===== */
:root{--p3:#1ba58b;--t40:40px;--t20:20px;--t12:12px;--ease:cubic-bezier(.23,1,.32,1);--in:200ms;--out:150ms;--z-panel:20;--z-bar:25;--z-tip:30;--z-proto:40;--panel-w:344px}
html,body{height:100%}
body{margin:0;color:var(--fg);font:400 var(--t14)/1.45 var(--sans);-webkit-font-smoothing:antialiased}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
a{color:inherit}
h1,h2,h3{text-wrap:balance;margin:0}
p{text-wrap:pretty;margin:0}
.n,.num{font-variant-numeric:tabular-nums}
:focus-visible{outline:2px solid var(--navy);outline-offset:2px;border-radius:4px}
[hidden]{display:none!important}
.proto{position:fixed;z-index:var(--z-proto);display:flex;align-items:center;color:#c9c9da}
.proto-name{color:#8f8fa8}
.proto nav{display:flex;gap:2px}
.proto nav a{color:#d6d6e4;text-decoration:none}
.proto nav a:hover{background:rgba(255,255,255,.08)}
.proto nav a[aria-current]{background:#fff;color:var(--ink)}
.proto-right{margin-left:auto;align-items:center;gap:14px}
.proto-as{align-items:center;gap:6px;cursor:pointer}
.proto-as input{accent-color:#fff;margin:0}
.proto button{background:none;border:0;color:#d6d6e4;text-decoration:underline;text-underline-offset:3px;padding:0;font-size:var(--t12)}
.app{display:grid;grid-template-columns:var(--side-w) minmax(0,1fr);min-height:100dvh;padding-top:var(--proto-h)}
.side{position:sticky;top:var(--proto-h);height:calc(100dvh - var(--proto-h));display:flex;flex-direction:column}
.logo{height:19px;width:auto;margin:3px 8px 2px;align-self:flex-start}
.nav{display:flex;flex-direction:column}
.nav a,.nav-off{display:flex;align-items:center;gap:10px;padding:5px 8px;border-radius:6px;font-size:var(--t14);text-decoration:none;color:var(--fg-2)}
.nav-off{color:var(--faint);cursor:default}
.nav a:hover{background:var(--hover)}
.nav a.on{color:var(--fg);font-weight:500}
.nav svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.6;opacity:.8}
.lab{font-size:var(--t12);color:var(--mut)}
.team{display:flex;flex-direction:column;gap:1px}
.team .lab{padding:0 8px 4px}
.person{display:flex;align-items:center;gap:8px;padding:4px 8px;border-radius:6px;font-size:var(--t14);text-decoration:none;color:var(--fg-2);cursor:default}
.person[href]{cursor:pointer}
.person[href]:hover{background:var(--hover)}
.person.on{background:var(--hover);color:var(--fg);font-weight:500}
.person .pn{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.st{width:6px;height:6px;border-radius:50%;flex:none;border:1px solid var(--faint)}
.st.live{background:var(--live);border-color:var(--live)}
.st.brk{background:var(--faint);border-color:var(--faint)}
.side-foot{margin-top:auto;padding:0 8px}
.ws{display:flex;align-items:center;gap:8px;font-size:var(--t14);color:var(--fg-2)}
.ws-sq{width:20px;height:20px;border-radius:5px;background:var(--navy);color:#fff;font-size:var(--t12);font-weight:500;display:grid;place-items:center}
.av{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font-size:10px;font-weight:500;color:#fff;flex:none}
main{min-width:0}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;font-size:var(--t14);font-weight:500;white-space:nowrap;transition:transform 120ms var(--ease),background-color 120ms}
.btn:active:not(:disabled){transform:scale(.97)}
.btn:disabled{opacity:.45;cursor:default}
.btn.icon{padding:0}
.btn.primary{border-color:var(--navy)}
.btn.ghost{border-color:transparent}
.btn svg{width:15px;height:15px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.link{border:0;background:none;padding:0;font-size:var(--t14);color:var(--fg);text-decoration:underline;text-decoration-color:var(--line-2);text-underline-offset:3px}
.badge{display:inline-flex;align-items:center;height:20px;padding:0 7px;font-size:var(--t12);font-weight:400}
.panel{position:fixed;z-index:var(--z-panel);background:var(--bg);display:flex;flex-direction:column;opacity:0;pointer-events:none;transition:opacity var(--out) ease-out,transform var(--out) ease-out}
.panel.open{opacity:1;pointer-events:auto;transition:opacity var(--in) var(--ease),transform var(--in) var(--ease)}
.ph{padding:14px 12px 0 16px;display:flex;align-items:flex-start;gap:4px}
.pb{padding:12px 16px 16px;display:flex;flex-direction:column;gap:14px;min-height:0;overflow:hidden}
.abar{position:fixed;z-index:var(--z-bar);left:calc(var(--side-w) + (100% - var(--side-w)) / 2);bottom:max(16px,env(safe-area-inset-bottom));transform:translate(-50%,10px);opacity:0;pointer-events:none;color:#fff;display:flex;align-items:center;gap:6px;font-size:var(--t14);white-space:nowrap;box-shadow:0 10px 30px rgba(9,9,11,.22);transition:opacity var(--out) ease-out,transform var(--out) ease-out}
.abar.open{opacity:1;transform:translate(-50%,0);pointer-events:auto;transition:opacity var(--in) var(--ease),transform var(--in) var(--ease)}
.abar .btn{height:28px;border-color:rgba(255,255,255,.2)}
.abar .btn.primary{background:#fff;color:var(--ink);border-color:#fff}
@media (hover:hover) and (pointer:fine){
  .abar .btn:hover:not(:disabled){background:rgba(255,255,255,.1)}
  .abar .btn.primary:hover{background:#ececf4}
}
.abar i{width:8px;height:8px;border-radius:2px;display:inline-block}
.toast{position:fixed;z-index:var(--z-bar);right:16px;bottom:max(16px,env(safe-area-inset-bottom));display:flex;align-items:center;gap:12px;background:var(--bg);padding:9px 10px 9px 14px;font-size:var(--t14);opacity:0;transform:translateY(8px);pointer-events:none;transition:opacity var(--out) ease-out,transform var(--out) ease-out}
.toast.open{opacity:1;transform:none;pointer-events:auto;transition:opacity var(--in) var(--ease),transform var(--in) var(--ease)}
.t-undo{border:0;background:var(--hover);padding:3px 9px;font-size:var(--t12);font-weight:500}
.tip{position:fixed;z-index:var(--z-tip);pointer-events:none;color:#fff;padding:6px 9px;font-size:12px;line-height:1.4;max-width:260px;box-shadow:0 6px 18px rgba(9,9,11,.2)}
.tip .s{color:#a9a9c2}
@media (prefers-reduced-motion:reduce){
  .panel,.panel.open,.abar,.abar.open,.toast,.toast.open{transform:none!important}
  main{transition:none}
}
:root{--bg:#fff;--sunk:#f4f4f5;--hover:#f4f4f5;--fill-2:#ececee;--fg:#0a0a0a;--fg-2:#404040;--mut:#6b6b6b;--faint:#a3a3a3;--navy:#333359;--navy-2:#26264a;--ink:#0f0f14;--gm:oklch(0.62 0.14 262);--pp:oklch(0.62 0.14 195);--flag:#0a0a0a;--flag-bg:#f4f4f5;--live:#16a34a;--sans:Geist,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;--mono:"Geist Mono",ui-monospace,SFMono-Regular,Menlo,monospace;--disp:var(--sans);--side-w:240px;--r-s:10px;--r-m:14px;--r-l:18px}
body{font-feature-settings:normal}
.num,.n{font-variant-numeric:tabular-nums}
.btn{border-radius:99px;border-color:transparent;padding:0 14px}
.btn.ghost{background:none}
@media (hover:hover) and (pointer:fine){
  .btn.ghost:hover:not(:disabled){background:var(--sunk)}
}

/* 19. No uppercase eyebrows: quiet sentence-case kicker */
.kicker{display:block;font-size:13px;font-weight:500;color:var(--fg-3);letter-spacing:0;text-transform:none;margin-bottom:6px}
.eyebrow{text-transform:none;letter-spacing:0;font-family:inherit}

/* Principle: no dividers where spacing does the job */
.tg,.config-group,.sf-optional,.preview-switch,.preview-bar,.preview-policy,.invitation-status,.invitation-status>div,.fdecision,.observations,.stepper,#pb .apps,.prow,.nrow,.prow-d,.lh,.days,.mrow,.pv-rows{border-top:0!important;border-bottom:0!important}
.sf-checklist{border-left:0!important;border-top:0!important;background:var(--sunk);border-radius:14px}
#panel.panel .pacts,.panel.modal .pacts,.panel .pacts.fdeck{border-top:0!important;box-shadow:0 -12px 24px -18px rgba(23,24,41,.18)}
.config-group+.config-group{margin-top:32px}
.config-group h3{margin-bottom:12px}
.tg{padding:10px 0}
.mrow{background:var(--sunk)}
.mrow:first-child{border-radius:15px 15px 0 0}
.mrow+.mrow{margin-top:2px}

/* 15. Motion. Drawer: full slide from the right edge, drawer curve. Modal: scale .96 + fade. Type switches never animate. */
#panel.panel:not(.modal){transform:translateX(calc(100% + 24px));opacity:1;transition:transform 200ms cubic-bezier(.32,.72,0,1),visibility 0s 200ms;visibility:hidden}
#panel.panel.open:not(.modal){transform:none;visibility:visible;transition:transform 280ms cubic-bezier(.32,.72,0,1),visibility 0s}
#panel.panel.modal{opacity:0;transform:translate(-50%,-50%) scale(.96);transition:opacity 150ms ease-out,transform 150ms ease-out}
#panel.panel.modal.open{opacity:1;transform:translate(-50%,-50%);transition:opacity 200ms ease-out,transform 200ms cubic-bezier(.23,1,.32,1)}
#panel.panel.no-anim{transition:none!important}
/* 11. Drawers dim the page lightly but never block it */
body.ov:not(.scrim)::after{content:"";position:fixed;inset:0;background:rgba(12,12,24,.10);z-index:19;pointer-events:none;animation:vin 200ms ease-out}
@media (prefers-reduced-motion:reduce){#panel.panel,#panel.panel.open{transition:opacity 1ms!important}}

/* 1. Drawer action row is a plain row, not a footer */
#panel.panel:not(.modal) .pacts:not(.fdeck){position:static;margin:4px 0 0;padding:0;min-height:0;box-shadow:none;background:none;gap:8px}
.apps-h{font-size:13px;font-weight:500;color:var(--fg-3);margin:0 0 6px}
#pb .apps{padding-top:8px}

/* 2. No accent bar on "Actions to review" */
.db .needs::before{display:none}

/* 3. Onboarding form gets room; headline on two lines */
body.bare .ob.two{grid-template-columns:minmax(0,540px) minmax(0,500px)}
.ob .ob-card{max-width:540px}
.ob-card .promise{margin:0}
.ob-card .proto-help{margin:-4px 0 0}

/* 6. One motif per screen: the setup card is plain white */
.setup-focus::before,.setup-focus::after{display:none}
.setup-focus .sf-main{background:#fff}

/* 8 + 9. Today table: one column system, header with breathing room, thicker bars, total with last Wed beneath */
:root{--g3d:minmax(190px,250px) minmax(0,1fr) 120px}
.db .g3d,.db .today .th{grid-template-columns:var(--g3d)!important;column-gap:20px}
.db .g3d>:nth-child(4):empty{display:none}
.db .today .th>.lab.tot,.db .today .th>.lab:last-child{grid-column:3}
.today-head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:20px}
.today-head h2{margin:0}
.today-head .s{margin:4px 0 0;font-size:13px}
.today-head .tlg{display:flex;gap:16px;font-size:13px;color:var(--fg-2)}
.today-head .tlg span{display:inline-flex;align-items:center;gap:6px}
.db .today .th{margin-bottom:4px;padding-bottom:8px}
.db .today .th .axis-d{font-family:var(--sans);font-size:12px;color:var(--fg-3)}
.db .today .th .lab{font-size:12px;color:var(--fg-3)}
.db .prow-d{min-height:64px;padding:8px 0}
.db .prow-d .mt{height:10px;border-radius:99px}
.db .prow-d .mt i{border-radius:99px}
.db .prow-d .tot{display:flex;flex-direction:column;align-items:flex-end;gap:2px;text-align:right}
.db .prow-d .tot b{font-weight:500;font-size:15px}
.db .prow-d .tot .s{font-size:12px}
@media (max-width:1180px) and (min-width:721px){:root{--g3d:minmax(160px,200px) minmax(0,1fr) 104px}}
@media (max-width:720px){:root{--g3d:minmax(0,1fr) 96px}.db .today .th{display:none}.today-head{flex-wrap:wrap}.db .prow-d .mt{display:none}}

/* 12. Tracking settings: calmer options, boxed schedule fields, simpler preview */
.mode{padding:16px 18px!important;border-radius:14px;border:0!important;box-shadow:inset 0 0 0 1px rgba(23,24,41,.12)!important;background:#fff}
.mode[aria-checked=true]{background:color-mix(in oklch,var(--navy) 5%,white)!important;box-shadow:inset 0 0 0 1.5px color-mix(in oklch,var(--navy) 55%,white)!important}
.mode b{font-weight:500}
.config-group h3{font-weight:600}
.tg b{font-weight:500}
.schedule-fields .inp,.schedule-fields select{height:40px;border-radius:10px;box-shadow:inset 0 0 0 1px rgba(23,24,41,.14);background:#fff;padding:0 12px}
.config-preview{background:var(--sunk);border:0!important}
.preview-head b{font-size:17px}
.preview-switch{display:inline-flex;padding:3px;border-radius:99px;background:#fff;box-shadow:inset 0 0 0 1px rgba(23,24,41,.1);gap:2px;margin:12px 0}
.preview-switch button{border-radius:99px;padding:6px 14px;border:0;background:none;font:500 13px var(--sans);color:var(--fg-2)}
.preview-switch button.active{background:var(--navy);color:#fff}
.preview-live{display:flex;align-items:center;gap:8px;flex-wrap:nowrap}
.preview-live .preview-pause{margin-left:auto}

/* 13. Invite: the email's own button is content; the message grows instead of scrolling */
.mail-cta{display:inline-flex;align-items:center;height:34px;padding:0 16px;border-radius:99px;background:var(--navy);color:#fff;font-size:13px;font-weight:500;opacity:.9}
.mtext{resize:none!important;overflow:hidden!important;max-height:none!important}
.mnote{margin:8px 2px 0;font-size:13px}

/* 14 + 20. Empty states: a ghost day, centred, fits the page */
.empty-activity{max-width:100%;display:flex;flex-direction:column;align-items:center;text-align:center;padding:48px 32px}
.ghost-day{width:min(420px,100%);margin:0 auto 20px}
.gd-track{position:relative;height:28px;border-radius:10px;background:var(--sunk)}
.gd-track i{position:absolute;top:5px;bottom:5px;border-radius:7px}
.gd-track .gm{background:color-mix(in oklch,var(--gm) 35%,white)}
.gd-track .pp{background:color-mix(in oklch,var(--pp) 35%,white)}
.gd-track .brk{background:repeating-linear-gradient(90deg,rgba(23,24,41,.18) 0 1px,transparent 1px 3px)}
.gd-track .idle{background:repeating-linear-gradient(135deg,rgba(255,255,255,.75) 0 3px,transparent 3px 7px),color-mix(in oklch,var(--pp) 35%,white)}
.gd-axis{display:flex;justify-content:space-between;margin-top:6px;font-size:11px;color:var(--fg-3)}

/* 16. Activity periods: the day read top to bottom on a rail */
.periods h2{margin-bottom:12px}
.rail{position:relative}
.rail::before{content:"";position:absolute;left:7px;top:14px;bottom:14px;width:2px;background:var(--sunk);border-radius:2px}
.rail .prow{display:grid!important;grid-template-columns:16px minmax(0,1fr) auto 64px!important;column-gap:14px;align-items:center;min-height:52px;padding:8px 10px 8px 0!important;border-radius:12px;position:relative}
.rail .prow .mk{width:12px;height:12px;border-radius:50%;justify-self:center;background:var(--c);box-shadow:0 0 0 3px #fff;position:relative}
.rail .prow.k-idle .mk{background:repeating-linear-gradient(135deg,rgba(255,255,255,.8) 0 2px,transparent 2px 4px),var(--c)}
.rail .prow.k-brk .mk{background:#fff;box-shadow:0 0 0 3px #fff,inset 0 0 0 2px var(--fg-3)}
.rail .prow.k-none .mk{width:6px;height:6px;background:var(--fg-3);opacity:.5}
.rail .prow.k-none,.rail .prow.k-brk{min-height:38px;padding-top:2px!important;padding-bottom:2px!important}
.rail .prow .pl{display:flex!important;align-items:baseline;gap:8px;padding:0!important;background:none!important;color:var(--fg)!important;border-radius:0;min-width:0}
.rail .prow .pl b{font-weight:500}
.rail .prow .pl .s{opacity:1!important;color:var(--fg-3)!important;font-size:13px}
.rail .prow .pt{color:var(--fg-2);font-size:14px}
.rail .prow .pd{text-align:right;font-weight:500}
.rail .prow.k-none .pt,.rail .prow.k-none .pd,.rail .prow.k-brk .pt,.rail .prow.k-brk .pd{color:var(--fg-3);font-weight:400}
.rail .prow .tag{background:none;border:1px solid var(--line-2);color:var(--fg-2);font-size:11px;padding:1px 8px;border-radius:99px}
.rail .prow .tag.open{border-color:var(--fg);color:var(--fg);background:none}
@media (hover:hover){.rail .prow:hover{background:var(--sunk)}}
.rail .prow.on{background:color-mix(in oklch,var(--gm) 7%,white)}
@media (max-width:720px){.rail .prow{grid-template-columns:16px minmax(0,1fr) auto!important}.rail .prow .pt{display:none}}

/* 18. Things that don't lead anywhere say so */
.side .person.static{cursor:default}
.nav-off{cursor:not-allowed}
.rail .prow>span{display:block!important;order:0!important;text-align:left}
.rail .prow>.pl{display:flex!important}
.rail .prow>.pd{text-align:right}
.preview-live{display:grid!important;grid-template-columns:auto minmax(0,1fr) auto;column-gap:8px;row-gap:2px;align-items:center}
.preview-live .live-dot{grid-row:1}
.preview-live>b{grid-column:2;white-space:nowrap}
.preview-live>span:not(.preview-pause):not(.live-dot){grid-column:2;grid-row:2;color:var(--fg-2);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.preview-live .preview-pause{grid-column:3;grid-row:1/span 2;margin:0}
#pb>*{flex-shrink:0}
.mail2{flex:none;overflow:visible}
.mail2 .mtext{flex:none}
@media (max-width:720px){.rail .prow>.pt{display:none!important}.rail .prow{grid-template-columns:16px minmax(0,1fr) auto!important}.rail .prow .pl{flex-wrap:wrap;row-gap:0}}



/* Precision polish: preserves the existing product visual language. */
/* Gentle gradient rings from the earlier team empty state. */
.av.ghost-av,.ghost .ghost-av,.pv-rows .ghost-av{
  width:25px;height:25px;border:2px solid transparent!important;border-radius:50%;
  background:linear-gradient(#fff,#fff) padding-box, conic-gradient(from 215deg,#d8e8e7 0deg,#8fcfc6 82deg,#dad5ed 165deg,#a7a2c8 255deg,#d8e8e7 360deg) border-box!important;
  box-shadow:0 1px 3px rgba(32,35,55,.055);position:relative; flex:none;
}
.ghost .ghost-av::after,.pv-rows .ghost-av::after{content:"";display:block;width:4px;height:4px;border-radius:50%;background:#c8c7d8;position:absolute;inset:0;margin:auto}
.ghost .who{gap:12px;align-items:center}
.ghost .mt.dashed{height:8px!important;border:0!important;border-radius:999px;background:repeating-linear-gradient(90deg,#e3e6eb 0 5px,transparent 5px 10px)!important;opacity:.82}
.db .today .prow-d.ghost{min-height:64px}
/* Time labels should never touch the plot edges. The underlying time scale is unchanged. */
.tl .axis span:first-child{left:12px!important;transform:none!important}
.tl .axis span:last-child{left:calc(100% - 12px)!important;transform:translateX(-100%)!important}
.db .axis-d span:first-child{left:10px!important;transform:none!important}
.db .axis-d span:last-child{left:calc(100% - 9px)!important;transform:translateX(-100%)!important}
/* Sample banner must wrap instead of cutting its message on narrow screens. */
.sample-banner>span{white-space:normal!important;overflow:visible!important;text-overflow:clip!important;line-height:1.5;flex:1 1 220px}
.sample-banner{gap:12px;align-items:center}
.sample-banner>.btn{height:auto;min-height:36px;max-width:100%;flex:0 0 auto;white-space:normal;line-height:1.25}
/* Don't crop date tabs at mobile sizes; allow scroll without breaking the timeline. */
.tl .days{overflow-x:auto;overscroll-behavior-inline:contain;scrollbar-width:none;flex-wrap:nowrap;padding:4px 1px 8px}
.tl .days::-webkit-scrollbar{display:none}
.tl .days .wrow{flex:0 0 auto}

/* Settings: independently scrollable form + stable footer, never overlapping a field. */
#panel.panel.config-workspace .pb{padding:0!important;overflow:hidden!important;display:flex!important;flex-direction:column;min-height:0}
#panel.panel.config-workspace .config-layout{overflow-y:auto;overscroll-behavior:contain;scrollbar-gutter:stable;min-height:0;flex:1 1 auto;padding:8px 28px 28px;margin:0;align-content:start}
#panel.panel.config-workspace .config-actions{position:relative!important;bottom:auto!important;margin:0!important;padding:15px 28px 18px!important;min-height:66px;flex:0 0 auto;z-index:2;border-top:1px solid #ededf0!important;box-shadow:none!important;background:#fff!important}
#panel.panel.config-workspace .config-actions>.s{font-size:12px}
#panel.panel.config-workspace .ph{flex:0 0 auto}
/* Onboarding preview: quiet interaction, unmistakably an example. */
.pv-intro{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.pv-intro .s{min-width:0;overflow-wrap:anywhere}
.pv-state{flex:0 0 auto;border:1px solid #e6e8ed;background:#f7f8fa;border-radius:999px;padding:4px 9px;color:#626672;font-size:11px;font-weight:500;line-height:1.1}
.pv-bar .pv-seg{position:absolute;display:block;top:9px;bottom:9px;border-radius:6px;opacity:0;transform:scaleX(.06);transform-origin:left center;transition:transform 720ms cubic-bezier(.21,.75,.25,1),opacity 260ms ease-out}
.pv-bar .pv-seg.pv-gm{left:11%;width:33%;background:#6089d8;transition-delay:25ms}

.pv-card.is-sample .pv-bar .pv-seg{opacity:1;transform:scaleX(1)}

.pv-live-dot{display:inline-block;width:6px;height:6px;border-radius:50%;background:#20a36d;vertical-align:middle;margin-right:5px;box-shadow:0 0 0 3px rgba(32,163,109,.09)}
.pv-controls{display:flex;align-items:center;justify-content:space-between;gap:16px;padding-top:12px;margin-top:4px;border-top:1px solid #eff0f2}

.pv-play{border:1px solid #dedfe5;background:#fff;border-radius:9px;min-height:34px;padding:7px 11px;white-space:nowrap;color:#333359;font:500 12px var(--sans);cursor:pointer;transition:border-color 120ms,background-color 120ms}
.pv-play:hover{background:#f7f7fb;border-color:#bdbdd0}
.pv-play:focus-visible{outline:2px solid #333359;outline-offset:2px}
.pv-play span{margin-left:4px}
.pv-rows>div{min-width:0}
.pv-rows .s{overflow-wrap:anywhere}

/* Final cohesive polish pass, 2026-11-12. Keeps the established flow and illustration style. */
:root { --polish-elev:0 1px 2px rgba(24,27,47,.025),0 9px 30px -18px rgba(24,27,47,.13); --polish-hairline:rgba(24,27,47,.09); }
/* Consistent type hierarchy, not a replacement of Geist. */
.ob-card .lab,.config-form label,.config-form .tg .s{font-size:14px;line-height:1.45}

.verify-address .link,.verify-resend .link{font-size:13px;font-weight:550;line-height:1.35}

.ob-prev .pv-intro .s{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

.ob-prev .pv-rows{margin-top:8px}
.ob-prev .pv-bar{flex-shrink:0}
.ob-prev .pv-bar .pv-seg{transform:scaleX(.04);opacity:0;transition:opacity .22s ease,transform .72s cubic-bezier(.2,.75,.25,1)}
.ob-prev .pv-card.is-sample .pv-bar .pv-seg{transform:scaleX(1);opacity:1}
.ob-prev .pv-big{min-height:64px;align-items:baseline}
/* Original empty team motif: fine dashed graphite ring and a soft highlight at bottom-right. */
.av.ghost-av,.ghost .ghost-av,.pv-rows .ghost-av{width:27px;height:27px;background:linear-gradient(142deg,#fff 46%,#f0f2f3 77%,#fdfefe 100%)!important;border:1.5px dashed #a9abad!important;border-radius:50%;box-shadow:inset -2px -2px 5px rgba(70,76,98,.04),2px 3px 5px -3px rgba(70,76,98,.17)!important;position:relative}
.ghost .ghost-av::after,.pv-rows .ghost-av::after{display:none!important}

.setup-focus .sf-item{min-height:42px}

/* Moderate elevation and consistent row affordances on the dashboard. */
.db .needs,.db .today,.db .projects,.sample-invite,.empty-activity{box-shadow:var(--polish-elev)!important;border-color:var(--polish-hairline)!important}
.db .needs h2{display:flex;align-items:center;gap:10px;font-weight:650}
.db .needs .cnt{background:#f0eff7;color:var(--navy);border:1px solid #e3e2ee;border-radius:99px;min-width:24px;text-align:center;padding:1px 7px;font-size:12px;font-weight:600}
.db .today a.prow-d:hover,.db .today .prow-d[href]:hover,.db .today .prow-d:hover{background:#f7f7f9!important;box-shadow:0 0 0 7px #f7f7f9!important;border-radius:7px}

.creating{display:flex;flex-direction:column;gap:18px;padding:8px 0}
.creating h1{font-size:clamp(26px,2.6vw,34px)!important;margin:0}
.creating-steps{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:12px}
.creating-steps li{display:flex;align-items:center;gap:12px;color:var(--fg-3);font-size:15px;transition:color 200ms ease}
.cs-i{width:20px;height:20px;border-radius:50%;box-shadow:inset 0 0 0 1.5px var(--line-2);display:grid;place-items:center;flex:none;transition:background-color 200ms ease,box-shadow 200ms ease}
.creating-steps li.done{color:var(--fg)}
.creating-steps li.done .cs-i{background:var(--live);box-shadow:none}
.creating-steps li.done .cs-i::after{content:"";width:9px;height:5px;border:2px solid #fff;border-top:0;border-right:0;transform:rotate(-45deg) translate(1px,-1px)}
/* 5. Invitations sent: icon tiles match the rest of the product */
.sent-step{grid-template-columns:32px 1fr!important;gap:14px!important}
.sent-step-ic{width:32px!important;height:32px!important;border-radius:10px!important}
.sent-step-ic svg{width:16px!important;height:16px!important;stroke-width:1.75!important}
/* 6. Starting preview */
.spin{width:14px;height:14px;border-radius:50%;border:2px solid rgba(255,255,255,.35);border-top-color:#fff;display:inline-block;margin-right:8px;animation:spin 700ms linear infinite;vertical-align:-2px}
@keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.spin{animation:none}}
/* 7. Invitees: an empty dashed track, no text inside */
.db .prow-d .mt.pending{height:10px;border-radius:99px;background:none!important;box-shadow:none;border:1.5px dashed var(--line-2)}
.db .prow-d .mt.pending>*{display:none}
/* 8. Sample workspace banner matches the navy "Explore a complete workday" card */
.sample-banner{background:var(--navy)!important;color:#fff!important;border:0!important}
.sample-banner b,.sample-banner span{color:#fff!important}
.sample-banner .btn{background:#fff!important;color:var(--navy)!important;box-shadow:none!important}
/* 9. Manual time: label on its own line, projects beneath */
#pb .pacts:has(> .lab){flex-wrap:wrap;row-gap:10px}
#pb .pacts > .lab{flex-basis:100%;font-size:13px;color:var(--fg-3)}
/* 10. Collapsed setup */
.setup-mini{display:flex;align-items:center;gap:12px;padding:14px 18px;border-radius:16px;background:#fff;border:1px solid var(--depth-line,rgba(23,24,41,.08));box-shadow:var(--depth,0 1px 2px rgba(0,0,0,.05));margin:12px 0 24px}
.setup-mini b{font-weight:600}
.setup-mini .sp{flex:1}
.setup-mini .ok-i{width:24px;height:24px;border-radius:50%;background:var(--live);color:#fff;display:grid;place-items:center;flex:none}
.setup-mini .ok-i svg{width:14px;height:14px;fill:none;stroke:#fff;stroke-width:2}
.sf-head #setupToggle{align-self:flex-start;margin-top:4px}
@media (max-width:720px){.setup-mini{flex-wrap:wrap}.setup-mini .sp{display:none}}
.db .prow-d .mt.pending{height:12px!important;min-height:12px;box-sizing:border-box}
#panel .pacts .btn.quiet{background:transparent!important;box-shadow:none!important;color:var(--fg-2)!important}
@media (hover:hover){#panel .pacts .btn.quiet:hover{background:var(--sunk)!important}}

/* bulk recipients: collapsed list and import */
.echip-more{border:0;cursor:pointer;font:inherit;font-size:var(--t12);font-weight:500;color:var(--ink);padding:0 8px}
.echip-more.quiet{background:none;color:var(--mut)}
.echip-more:hover{text-decoration:underline}
.chips-in.all{max-height:168px;overflow:auto}
.mbtns{display:flex;gap:6px;align-self:start}
@media (max-width:640px){#panel.panel.invite-modal .mrow:first-child{grid-template-columns:48px minmax(0,1fr)!important}.mbtns{grid-column:2}}
#panel.panel.invite-modal .pacts #inviteLater{margin-left:auto}#panel.panel.invite-modal .pacts #inviteLater+.btn{margin-left:0}
/* Invitations sent: small icon tiles, sized to the 14px title beside them */
.sent-step{grid-template-columns:24px minmax(0,1fr)!important;gap:12px!important}
#panel .sent-step-ic{width:24px!important;height:24px!important;border-radius:7px!important;flex-basis:24px;margin-top:1px}
#panel .sent-step-ic::before{width:13px!important;height:13px!important}
#panel .sent-step-ic svg{width:13px!important;height:13px!important}

</style></head>

<script>
globalThis.M = (() => {
/* Demo data and time math. No DOM. Minutes from midnight; a day ends at 1440. */

const hm = m => String(Math.floor(m / 60) % 24).padStart(2, '0') + ':' + String(m % 60).padStart(2, '0');
const dur = m => { m = Math.round(m); const h = Math.floor(m / 60), r = m % 60; return h ? `${h}h ${String(r).padStart(2, '0')}m` : `${r}m`; };

const PROJECTS = {
  gm: { name: 'General Motors', color: 'var(--gm)', task: 'Q4 dashboard', apps: [['Google Chrome', 5], ['Microsoft Excel', 3], ['Slack', 2]] },
  pp: { name: 'PayPal', color: 'var(--pp)', task: 'Support issue', apps: [['Sublime Text', 4], ['Remote Desktop', 4], ['Microsoft Teams', 2]] }
};
const PEOPLE = [
  { id: 'angelica', name: 'Angelica Pickles', ini: 'AP', color: '#0b7a6f', role: 'Support engineer' },
  { id: 'betty', name: 'Betty DeVille', ini: 'BD', color: '#7a5af8', role: 'Account manager' },
  { id: 'howard', name: 'Howard DeVille', ini: 'HD', color: '#3b5bdb', role: 'Analyst' }
];
const NOW = 16 * 60 + 40; // Wed 11 Nov, 16:40

/* Minutes with keyboard or mouse input per 10-minute slot (0 to 10), tracked slots only. */
const TUE_INPUT = [
  8, 7,                                                         // 13:50, 14:00
  9, 8, 10, 9, 7, 10, 9, 10, 8, 9, 10, 10, 9, 10, 8, 10, 9,       // 15:50 to 18:30
  8, 9, 10, 9, 7, 10, 9, 8, 10, 9, 9, 7, 10,                    // 20:50 to 22:50
  0, 0, 0, 0, 0, 0                                              // 23:00 to 23:50, no input
];
const BASE = [
  { key: 'mon', label: 'Mon 9', segs: [{ kind: 'gm', a: 9 * 60 + 10, b: 12 * 60 + 30 }, { kind: 'brk', a: 12 * 60 + 30, b: 13 * 60 + 5 }, { kind: 'pp', a: 13 * 60 + 5, b: 16 * 60 + 20 }] },
  { key: 'tue', label: 'Tue 10', segs: [{ kind: 'gm', a: 13 * 60 + 53, b: 14 * 60 + 10 }, { kind: 'gm', a: 15 * 60 + 55, b: 18 * 60 + 37 }, { kind: 'brk', a: 18 * 60 + 37, b: 19 * 60 + 2 }, { kind: 'pp', a: 20 * 60 + 50, b: 1440 }],
    flags: [{ a: 23 * 60, b: 1440, text: 'No keyboard or mouse input for 1h, 23:00 to 00:00.', rule: 'Company rule: idle over 30m' }] },
  { key: 'wed', label: 'Wed 11', today: true, segs: [{ kind: 'gm', a: 9 * 60 + 2, b: 12 * 60 + 15 }, { kind: 'brk', a: 12 * 60 + 15, b: 12 * 60 + 45 }, { kind: 'pp', a: 12 * 60 + 45, b: NOW }] },
  { key: 'thu', label: 'Thu 12', segs: [] },
  { key: 'fri', label: 'Fri 13', segs: [] }
];

const WEEK = [];
const history = [];

const slotStart = m => Math.floor(m / 10) * 10;
const isWork = s => s.kind !== 'brk';

function slotsOf(seg) { const out = []; for (let m = slotStart(seg.a); m < seg.b; m += 10) out.push(m); return out; }

function reset() {
  WEEK.length = 0; history.length = 0;
  BASE.forEach((d, i) => {
    const day = { ...d, segs: d.segs.map(s => ({ ...s })), flags: d.flags || [], input: {} };
    const slots = [...new Set(day.segs.filter(isWork).flatMap(slotsOf))];
    slots.forEach((m, j) => { day.input[m] = d.key === 'tue' ? TUE_INPUT[j] : 5 + ((m * 7 + i * 13) % 6); });
    WEEK.push(day);
  });
}
reset();

function totals(day) {
  const t = { gm: 0, pp: 0, brk: 0, man: 0, worked: 0 };
  day.segs.forEach(s => { const n = s.b - s.a; t[s.kind] += n; if (s.man) t.man += n; if (isWork(s)) t.worked += n; });
  return t;
}

function inputPct(day) {
  const v = Object.values(day.input);
  return v.length ? Math.round(v.reduce((a, b) => a + b, 0) / (v.length * 10) * 100) : 0;
}

const stretchAt = (day, m) => day.segs.find(s => isWork(s) && m >= s.a && m < s.b) || null;

function stateAt(day, m) {
  const s = day.segs.find(x => m >= x.a && m < x.b);
  if (!s) return 'none';
  if (s.kind === 'brk') return 'break';
  if (s.man) return 'manual';
  return day.input[slotStart(m)] === 0 ? 'idle' : 'tracked';
}

function stepSlot(day, slot, dir) {
  const all = [...new Set(day.segs.filter(isWork).flatMap(slotsOf))].sort((a, b) => a - b);
  const i = all.indexOf(slot);
  if (i < 0) return slot;
  return all[Math.min(all.length - 1, Math.max(0, i + dir))];
}

function edit(day, a, b, kind, man = false) {
  history.push({ key: day.key, segs: JSON.stringify(day.segs) });
  const out = [];
  day.segs.forEach(s => {
    if (s.b <= a || s.a >= b || s.kind === 'brk') return out.push(s);
    if (s.a < a) out.push({ ...s, b: a });
    if (s.b > b) out.push({ ...s, a: b });
    if (kind && !man) out.push({ ...s, a: Math.max(s.a, a), b: Math.min(s.b, b), kind });
  });
  if (man) {
    out.push({ kind, a, b, man: true });
    for (let m = slotStart(a); m < b; m += 10) if (!(m in day.input)) day.input[m] = null;
  }
  day.segs = out.sort((x, y) => x.a - y.a);
}

function undo() {
  const h = history.pop(); if (!h) return null;
  WEEK.find(d => d.key === h.key).segs = JSON.parse(h.segs);
  return h.key;
}
const canUndo = () => history.length > 0;

return {hm, dur, PROJECTS, PEOPLE, NOW, WEEK, slotsOf, reset, totals, inputPct, stretchAt, stateAt, stepSlot, edit, undo, canUndo};
})();
/* Shared DOM helpers, router, panel, toast, tooltip. */
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const esc = v => String(v ?? '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
const ICON = {
  left: '<svg viewBox="0 0 24 24"><path d="m15 6-6 6 6 6"/></svg>',
  right: '<svg viewBox="0 0 24 24"><path d="m9 6 6 6-6 6"/></svg>',
  x: '<svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></svg>',
  plus: '<svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>',
  info: '<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 11v5M12 8h.01"/></svg>',
  dash: '<svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="9" rx="1.5"/><rect x="14" y="3" width="7" height="5" rx="1.5"/><rect x="14" y="12" width="7" height="9" rx="1.5"/><rect x="3" y="16" width="7" height="5" rx="1.5"/></svg>',
  time: '<svg viewBox="0 0 24 24"><path d="M3 7h18M3 12h12M3 17h8"/></svg>',
  people: '<svg viewBox="0 0 24 24"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c.8-3.5 3.4-5.5 6.5-5.5s5.7 2 6.5 5.5M16 4.5a3.5 3.5 0 0 1 0 7M18 14.5c2 .6 3.2 2.6 3.5 5.5"/></svg>',
  proj: '<svg viewBox="0 0 24 24"><path d="M3 7.5A1.5 1.5 0 0 1 4.5 6H9l2 2h8.5A1.5 1.5 0 0 1 21 9.5v9a1.5 1.5 0 0 1-1.5 1.5h-15A1.5 1.5 0 0 1 3 18.5z"/></svg>',
  rep: '<svg viewBox="0 0 24 24"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>',
  check: '<svg viewBox="0 0 24 24"><path d="m5 12.5 4.5 4.5L19 7.5"/></svg>',
  user: '<svg viewBox="0 0 24 24"><circle cx="12" cy="8.5" r="3.5"/><path d="M5 20c1-3.6 3.7-5.5 7-5.5s6 1.9 7 5.5"/></svg>',
  send: '<svg viewBox="0 0 24 24"><path d="M22 2 11 13M22 2l-7 20-4-9-9-4 20-7z"/></svg>',
  laptop: '<svg viewBox="0 0 24 24"><rect x="4" y="5" width="16" height="11" rx="1.5"/><path d="M2 19h20"/></svg>',
  eye: '<svg viewBox="0 0 24 24"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg>'
};

const App = {
  routes: {},
  current: null,
  route(name, render) { this.routes[name] = render; },
  go() {
    const name = (location.hash.replace(/^#\/?/, '').split('?')[0]) || 'onboarding';
    const r = this.routes[name] ? name : Object.keys(this.routes)[0];
    closePanel(true); hideBar(); this.current = r; scrollTo(0, 0);
    $$('.proto nav a').forEach(a => a.toggleAttribute('aria-current', a.dataset.r === r));
    document.body.dataset.route = r;
    this.routes[r]();
    if (typeof saveSetup === 'function') saveSetup();
    const v = $('#view'); v.classList.remove('vin'); void v.offsetWidth; v.classList.add('vin');
    drawNav(r);
  },
  start() {
    addEventListener('hashchange', () => this.go());
    $('#asEmployee').addEventListener('change', e => { document.body.dataset.as = e.target.checked ? 'employee' : 'manager'; if (!e.target.checked || App.current === 'timeline') this.go(); else location.hash = '#/timeline'; });
    $('#restart').addEventListener('click', () => { try { sessionStorage.removeItem('monitask-demo-workspace-v3'); } catch {} M.reset(); App.reset?.(); OB.screen='account'; OB.codeSent=false; location.hash = '#/onboarding'; this.go(); });
    document.body.dataset.as = 'manager';
    this.go();
  }
};

function drawNav(route) {
  const emp = document.body.dataset.as === 'employee';
  const items = emp ? [['timeline', 'My time', ICON.time]] :
    [['dashboard', 'Dashboard', ICON.dash], [SETUP.size==='Just me'&&SETUP.you.tracking ? 'mytime' : 'timeline', SETUP.size==='Just me'&&SETUP.you.tracking ? 'My timeline' : 'Timeline', ICON.time], [null, 'People', ICON.people], [null, 'Projects', ICON.proj], [null, 'Reports', ICON.rep]];
  $('#nav').innerHTML = items.map(([r, l, i]) => r ? `<a href="#/${r}" class="${r === route ? 'on' : ''}" ${r === route ? 'aria-current="page"' : ''}>${i}${l}</a>` : `<span class="nav-off" title="Not part of this prototype">${i}${l}</span>`).join('');
  const team = App.team ? App.team() : [];
  $('#team').innerHTML = emp || !team.length ? '' : `<span class="lab">Team · ${team.length}</span>` + team.map(p => `<a class="person${p.on ? ' on' : ''}${p.href ? '' : ' static'}" ${p.href ? `href="${p.href}"` : ''} ${p.tip ? `title="${esc(p.tip)}"` : ''}><span class="av" style="background:${p.color}">${p.ini}</span><span class="pn">${esc(p.name)}</span><span class="st ${p.state || ''}" title="${esc(p.stateLabel || '')}" aria-label="${esc(p.stateLabel || 'Status unknown')}"></span></a>`).join('');
  const co = SETUP.sample ? 'Monitask' : ((!SETUP.active && App.current !== 'onboarding') ? 'Sample workspace' : (SETUP.company || 'Your workspace'));
  $('#sideFoot').innerHTML = `<span class="ws"><span class="ws-sq">${esc(co[0].toUpperCase())}</span><span class="ws-label" title="${esc(co)}">${esc(co)}</span></span>`;
}

/* Panel: a drawer that slides over the page, or a centred modal. The page never moves. */
let panelClose = null;
let panelOpener = null;
function openPanel(head, body, onClose, opts = {}) {

function commitEdit(a,b,kind,man,reason) {

function periods(day) {
  const segs = [...day.segs].sort((x, y) => x.a - y.a), out = [];
  segs.forEach((s, i) => {
    if (i && s.a > segs[i - 1].b) out.push({ kind: 'none', a: segs[i - 1].b, b: s.a });
    const f = emp() ? null : day.flags.find(f => s.kind !== 'brk' && f.a >= s.a && f.b <= s.b && fState(day, f) !== 'removed');
    if (!f) return out.push(s);
    if (f.a > s.a) out.push({ ...s, b: f.a });
    out.push({ ...s, a: f.a, b: f.b, idle: fState(day, f) || 'open' });
    if (f.b < s.b) out.push({ ...s, a: f.b });
  });

}

      <div class="pacts config-actions"><span class="s" id="configStatus">${S.rules?'Review changes before saving':'Next: invite your team'}</span><button class="btn" id="configCancel">Cancel</button><button class="btn primary" id="rulesSave" ${canSave()?'':'disabled'}>${S.rules?'Save changes':'Save and continue'}</button></div>`,null,{wide:true});
     $('#panel').classList.add('config-workspace');
     requestAnimationFrame(()=>{
       const next=$('#panel.config-workspace .config-layout');if(next)next.scrollTop=configScroll;
       if(restoreFocus){const target=restoreFocus.startsWith('mode:')?$('#panel [data-mode="'+restoreFocus.slice(5)+'"]'):$('#'+restoreFocus);target?.focus({preventScroll:true});}
     });
     const renderPreview=()=>{
       const el=$('#dynamicPreview');if(!el)return;
       const employee=preview==='employee';
       el.innerHTML=employee?`<div class="preview-window"><div class="preview-bar"><span class="appmark">M</span><b>Monitask</b><span class="s">Employee app</span></div>${draft.mode==='visible'?`<div class="preview-live"><span class="live-dot"></span><b>Tracking active</b><span>2h 14m · General Motors</span><span class="preview-pause">Pause</span></div><p class="s">Employees can review their own activity and pause tracking when allowed.</p>`:`<div class="preview-off"><b>Background tracking enabled</b><p>No on-screen tracking indicator is shown. Employees still need clear prior notice.</p></div>`}</div>`:
       `<div class="preview-window"><div class="preview-bar"><span class="appmark">M</span><b>Manager dashboard</b><span class="s">Workspace view</span></div><div class="manager-preview-row"><span>Recorded today</span><strong>2h 14m</strong></div><div class="manager-preview-row"><span>Activity level</span><strong>72%</strong></div><div class="manager-preview-row"><span>Apps & sites</span><strong>${draft.names?'Visible':'Hidden'}</strong></div><div class="manager-preview-row"><span>Screenshots</span><strong>${draft.blur?'Blurred':'Clear'}</strong></div></div>`;
       el.insertAdjacentHTML('beforeend',`<div class="preview-meta preview-schedule" aria-label="Tracking schedule">${draft.hours ? `<span>${draft.scheduleDays==='weekdays'?'Mon–Fri':'Every day'}</span> <span class="num">${draft.startHour}–${draft.endHour}</span> <span class="preview-timezone">${draft.timezone}</span>` : `<span>No fixed schedule</span>`}</div>`);
     };
     renderPreview();
     $('#pvEmployee').onclick=()=>{preview='employee';$$('.preview-switch button').forEach(b=>{b.classList.toggle('active',b.id==='pvEmployee');b.setAttribute('aria-selected',b.id==='pvEmployee')});renderPreview();};
     $('#pvManager').onclick=()=>{preview='manager';$$('.preview-switch button').forEach(b=>{b.classList.toggle('active',b.id==='pvManager');b.setAttribute('aria-selected',b.id==='pvManager')});renderPreview();};
     const discard=()=>{if(!dirty())return closePanel();const x=document.createElement('div');x.className='confirm-discard';x.innerHTML=`<div class="discard-box" role="alertdialog" aria-modal="true" aria-labelledby="discardTitle"><h3 id="discardTitle">Discard unsaved changes?</h3><p>Your tracking preferences won't be updated.</p><div class="discard-actions"><button class="btn" id="keepConfig">Keep editing</button><button class="btn primary" id="discardConfig">Discard changes</button></div></div>`;$('#panel').appendChild(x);$('#keepConfig').onclick=()=>x.remove();$('#discardConfig').onclick=()=>{x.remove();closePanel(true);};$('#keepConfig').focus();};
     window.__closeConfig=discard;
     $('#panel').onclick=e=>{
        if(e.target.closest('[data-x]')||e.target.closest('#configCancel'))return discard();
        const mode=e.target.closest('[data-mode]');if(mode){draft.mode=mode.dataset.mode;draft.ack=false;return draw('mode:'+mode.dataset.mode);}
        const sw=e.target.closest('.sw');if(sw){const k={swH:'hours',swB:'blur',swN:'names'}[sw.id];draft[k]=!draft[k];return draw(sw.id);}
        if(e.target.closest('#rulesSave')){
           if(!canSave())return;
           if(draft.hours && draft.endHour<=draft.startHour){toast('End time must be later than start time');return;}
           const firstTime=!S.rules;const didChange=dirty();Object.assign(S, Object.fromEntries(configKeys.map(k=>[k,draft[k]])));S.ack=draft.ack;S.rules=true;
           if(didChange){S.rulesRevision++;if(S.editedMsg)S.messageStale=true;else {S.msg=null;S.messageStale=false;} }
           window.__closeConfig=null;$('#panel').classList.remove('config-workspace');if(firstTime&&!S.sent){redrawDash();return App.openStep(3);}closePanel(true);redrawDash();toast(S.messageStale?'Settings saved. Review employee communication before sending.':'Tracking preferences saved');
        }
     };
     const ack=$('#ack');if(ack)ack.onchange=()=>{draft.ack=ack.checked;$('#rulesSave').disabled=!canSave();};
     for(const [id,key] of [['schDays','scheduleDays'],['schStart','startHour'],['schEnd','endHour'],['schZone','timezone']]){const inp=$('#'+id);if(inp)inp.onchange=()=>{draft[key]=inp.value;renderPreview();const err=draft.endHour<=draft.startHour;$('#rulesSave').disabled=err||!canSave();$('#configStatus').textContent=err?'End time must be later than start time':(dirty()?'Unsaved changes':'Settings saved');};}
   };
   return draw();
 }
 if(n===3){
   if(!S.rules)return toast('Configure tracking before inviting employees.');
   S.emails ||= [];
   const drawInvite=()=>{
     const current=S.msg || inviteMsg();
     openPanel(stepHeader(S.sent?'Review team communication':'Invite your team','Let employees know what will be recorded'),`
      <div class="mail2"><div class="mrow"><span class="ml">To</span><div class="chips-in${S.showAll&&S.emails.length>8?' all':''}" id="chipsIn">${(S.emails.length>8&&!S.showAll?S.emails.slice(0,6):S.emails).map((e,i)=>`<span class="echip">${esc(e)}<button aria-label="Remove ${esc(e)}" data-rm="${i}">${ICON.x}</button></span>`).join('')}${S.emails.length>8?`<button class="echip echip-more" id="toggleAll">${S.showAll?'Show fewer':`+${S.emails.length-6} more`}</button><button class="echip echip-more quiet" id="clearAll">Remove all</button>`:''}<input id="emailIn" placeholder="name@company.com" aria-label="Add employee email" autocomplete="off" type="email"></div><span class="mbtns"><button class="btn sm" id="addRecipient">Add</button><button class="btn sm" id="importList">Import</button></span><input type="file" id="importFile" accept=".csv,.txt,text/csv,text/plain" hidden></div>
       <div class="mrow"><span class="ml">Subject</span><span>Monitask at ${esc(S.company || 'your company')}</span></div>
       <textarea class="mtext" id="msg" aria-label="Invitation message">${esc(current)}</textarea>
       <div class="mfoot"><span class="mail-cta" aria-hidden="true">See what Monitask records about me</span></div></div>
       <p class="s mnote">Employees will be able to review their own recorded activity.</p>
       
       ${S.messageStale?`<div class="invite-warning"><b>Tracking preferences have changed.</b><p>Review this message to ensure it explains the current settings.</p><label><input type="checkbox" id="reviewedSettings"> I checked that the message matches the current settings.</label></div>`:''}
       <div class="pacts"><span class="s">${S.emails.length ? (S.sent ? 'Sends an updated notice' : 'Last step') : 'Add at least one email'}</span>${S.sent?'':'<button class="btn quiet" id="inviteLater">Invite later</button>'}<button class="btn primary" id="send" ${S.emails.length&&!S.messageStale?'':'disabled'}>${S.sent?'Send update':S.emails.length?`Send ${S.emails.length} invitation${S.emails.length===1?'':'s'}`:'Send invitations'}</button></div>`,null,{wide:true});
      $('#panel').classList.add('invite-modal');
      const fit=t=>{t.style.height='auto';t.style.height=t.scrollHeight+'px';};
      $('#msg').oninput=e=>{S.msg=e.target.value;S.editedMsg=true;fit(e.target);};fit($('#msg'));
      const add=()=>{const inp=$('#emailIn'),val=inp.value.trim().replace(/,$/,'').toLowerCase();if(/^\S+@\S+\.\S+$/.test(val)&&!S.emails.includes(val)){S.emails.push(val);return drawInvite();}if(val) {inp.setAttribute('aria-invalid','true');toast('Enter a valid, unique email address');}};
      $('#emailIn').onkeydown=e=>{if(e.key==='Enter'||e.key===','){e.preventDefault();add();}};
      $('#importFile').onchange=async e=>{const f=e.target.files[0];if(!f)return;const found=parseEmails(await f.text()),fresh=found.filter(x=>!S.emails.includes(x));S.emails.push(...fresh);drawInvite();toast(found.length?`${fresh.length} added${found.length>fresh.length?` · ${found.length-fresh.length} already in the list`:''}`:'No email addresses found in that file');};
      const chk=$('#reviewedSettings');if(chk)chk.onchange=()=>{$('#send').disabled=!(chk.checked&&S.emails.length);};
      $('#panel').onclick=e=>{
       if(e.target.closest('[data-x]')){ $('#panel').classList.remove('invite-modal');return closePanel();}
       if(e.target.closest('#inviteLater')){ $('#panel').classList.remove('invite-modal'); closePanel(true); redrawDash(); return; }
       if(e.target.closest('#addRecipient'))return add();
       if(e.target.closest('#importList'))return $('#importFile').click();
       if(e.target.closest('#toggleAll')){S.showAll=!S.showAll;return drawInvite();}
       if(e.target.closest('#clearAll')){S.emails=[];S.showAll=false;return drawInvite();}
       const r=e.target.closest('[data-rm]');if(r){S.emails.splice(+r.dataset.rm,1);return drawInvite();}
       if(e.target.closest('#send')){if(!S.emails.length||S.messageStale&&!$('#reviewedSettings')?.checked)return;S.invited=[...new Set([...S.invited,...S.emails])];S.sent=true;S.messageStale=false;S.messageRevision=S.rulesRevision;S.msg=$('#msg').value;S.editedMsg=true;$('#panel').classList.remove('invite-modal');redrawDash();finishSetup();}
      };
   };
   drawInvite();
 }
};
// Pulls every email address out of pasted or imported text (CSV columns, "Name <a@b.co>", one per line), lowercased, no duplicates.
function parseEmails(text) { return [...new Set((String(text).match(/[^\s,;<>"'()]+@[^\s,;<>"'()]+\.[a-z]{2,}/gi) || []).map(e => e.toLowerCase()))]; }
function inviteMsg() {
 const S=SETUP;
 const visibility=S.mode==='visible'?'You can see when tracking is on, pause it, and review your activity.':'Tracking can run without an on-screen indicator. Please ask us about this setting if anything is unclear.';
 const screenshot=S.blur?'Screenshots are blurred to reduce visible detail, but some content may still be recognizable.':'Screenshots may include content visible on your screen.';
 return [`Hi team,`,
 `We're setting up Monitask to keep project time records in one place. Before you get started, here's what to expect.`,
 `When tracking runs: ${fmtSchedule(S)}\nTracking visibility: ${visibility}\nApps and websites: ${S.names?'App and website names may be recorded.':'Names are not recorded.'}\nScreenshots: ${screenshot}`,
 `Monitask also measures keyboard and mouse input. This doesn't tell us how well someone is working. You can ask about your records or request a correction at any time.`,
 `Thanks`].join('\n\n');
}
function finishSetup() {
 const S=SETUP,n=S.invited.length;
 openPanel(stepHeader('Invitations sent','Waiting for your team'),`
   <div class="sent-art" aria-hidden="true">${S.invited.slice(0, 5).map((e, i) => `<span class="av" style="background:${['#0b7a6f', '#7a5af8', '#3b5bdb', '#333359', '#b05a2a'][i % 5]}">${esc(nameOf(e).split(' ').map(x => x[0]).join('').slice(0, 2))}</span>`).join('')}${n > 5 ? `<span class="av more">+${n - 5}</span>` : ''}<span class="sent-badge">${CK}</span></div>
   <p class="pnote sent-message">${n === 1 ? 'Your teammate has been invited.' : `${n} teammates have been invited.`} Here's what happens next.</p>
   <div class="sent-steps">
     <div class="sent-step"><span class="sent-step-ic navy" aria-hidden="true"></span><div><b>Invitation pending</b><span>They can accept when they are ready.</span></div></div>
     <div class="sent-step"><span class="sent-step-ic blue" aria-hidden="true"></span><div><b>Connect desktop app</b><span>After accepting, they install and connect Monitask.</span></div></div>
     <div class="sent-step"><span class="sent-step-ic teal" aria-hidden="true"></span><div><b>First activity recorded</b><span>Recorded time appears once they start tracking.</span></div></div>
   </div>
   <div class="pacts"><button class="btn primary" id="goWorkspace" style="margin-left:auto">View workspace</button></div>`,null,{wide:true});
 $('#panel').onclick=e=>{if(e.target.closest('[data-x]')||e.target.closest('#goWorkspace')){closePanel(true);SETUP.sample=false;location.hash='#/dashboard';App.go();}};
}

App.route('onboarding', renderOnboarding);
const _go = App.go.bind(App);
App.go = function () { document.body.classList.remove('bare'); if (App.current === 'dashboard' && !location.hash.startsWith('#/dashboard')) clearTimers(); _go(); };
window.__ob = { go(s) { OB.screen = s; OB.codeSent = false; location.hash = '#/onboarding'; App.go(); }, state: () => ({ ...OB }) };


/* Persistent product illustration, shared by email, verification and company details.
   Keep the DOM node mounted across steps so progress does not re-animate. */
let retainedOnboardingPreview = null;
function obPreview(previousNode=null) {
  const ob=document.querySelector('.ob');
  if (!ob) return;
  ob.classList.add('two');
  let node=previousNode || retainedOnboardingPreview;
  if (!node) {
    node=document.createElement('aside');
    node.className='ob-prev';
    node.setAttribute('aria-label','Workspace activity preview');
    node.innerHTML=`<div class="ob-stage">
      <div class="pv-card" id="pvCard">
        <div class="pv-intro"><span class="s" id="pvCo">Your company · Today</span><span class="pv-state">Sample activity</span></div>
        <div class="pv-big"><span id="pvTime">3h 24m</span><span class="s">recorded today</span></div>
        <div class="pv-chart">
          <div class="pv-bar" id="pvBar" aria-label="Example time recorded across two projects">
            <i class="pv-seg pv-gm" aria-hidden="true"></i>
            <i class="pv-seg pv-pp" aria-hidden="true"></i>
            <i class="pv-seg pv-break" aria-hidden="true"></i>
          </div>
          <div class="pv-ax num"><span>09:00</span><span>13:00</span><span>17:00</span><span>21:00</span></div>
        </div>
        <div class="pv-projects"><span><i class="pv-dot gm"></i>General Motors</span><span><i class="pv-dot pp"></i>PayPal</span></div>
        <div class="pv-rows">
          <div><span class="av" id="pvMe" style="background:#333359">Y</span><span>You</span><span class="s">3h 24m</span></div>
          <div><span class="av ghost-av" id="pvTeamCircle"></span><span>Teammate</span><span class="s">Not connected</span></div>
        </div>
      </div>
    </div>`;
    retainedOnboardingPreview=node;
    requestAnimationFrame(()=>requestAnimationFrame(()=>node.querySelector('#pvCard')?.classList.add('is-sample')));
  }
  ob.appendChild(node);
  const sync=()=>{
    const company=document.querySelector('#co');
    const n=company?.value.trim() || SETUP.company || 'Your company';
    const title=node.querySelector('#pvCo'); if(title) title.textContent=n+' · Today';
    const email=document.querySelector('#email');
    const letter=(email?.value.trim() || OB.email || '').slice(0,1).toUpperCase();
    const av=node.querySelector('#pvMe'); if(av) av.textContent=letter||'Y';
  };
  document.querySelector('#email')?.addEventListener('input',sync);
  document.querySelector('#co')?.addEventListener('input',sync);
  sync();
}
const _renderOb = renderOnboarding;
renderOnboarding = function () {
  const previous=document.querySelector('.ob-prev');
  if(previous) previous.remove();
  _renderOb();
  obPreview(previous);
};
App.route('onboarding', renderOnboarding);

/* A reload keeps your workspace for this browser session. Restart clears it. */
/* The whole setup survives a reload in this browser session: workspace, tracking settings, invitations, progress. Restart clears it. */
function saveSetup() { try { if (SETUP.active) sessionStorage.setItem('monitask-demo-workspace-v3', JSON.stringify({ v: 2, setup: SETUP, email: OB.email })); } catch {} }
try {
  const saved = JSON.parse(sessionStorage.getItem('monitask-demo-workspace-v3') || 'null');
  if (saved && /^#\/?(dashboard|timeline|mytime)/.test(location.hash)) {
    if (saved.v === 2 && saved.setup) { Object.assign(SETUP, saved.setup); OB.email = saved.email || ''; }
    else if (saved.company) { SETUP.company = String(saved.company).slice(0, 80); SETUP.size = saved.size || ''; SETUP.active = true; OB.email = saved.email || ''; }
  }
} catch {}


/* Personal timeline for the simulated self-tracking session.
   The UI does not claim real device telemetry. */
function renderMyTimeline(){
  const S=SETUP;
  if(!S.active){location.hash='#/dashboard';App.go();return;}
  const started=S.you.start ? new Date(S.you.start) : new Date();
  const startedAt=started.toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'});
  const live=!!S.you.tracking;
  const seconds=()=>live?Math.max(0,Math.floor((Date.now()-S.you.start)/1000)):0;
  const elapsed=()=>fmtS(seconds());
  $('#view').innerHTML=`<div class="db mytime-page">
    <header class="db-head"><div><span class="lab">${esc(S.company || 'Your workspace')} / My time</span><h1>My timeline</h1><p class="s">Your first session, from the employee's perspective.</p></div><a class="btn" href="#/dashboard">Back to workspace</a></header>
    <section class="mytime-session" aria-label="Current tracking session"><div class="mytime-session-head"><div><span class="mytime-status">${live?'<span class="live-dot"></span>Preview running':'Not tracking'}</span><h2>Current session</h2><p>Started at ${startedAt}</p></div><div class="mytime-clock" id="myTimeClock">${elapsed()}</div></div>
      <div class="mytime-track" role="img" aria-label="An illustrative current tracking interval"><span class="mytime-track-fill"></span><span class="mytime-now"></span></div>
      <div class="mytime-axis"><span>${startedAt} · Start</span><span>1-hour scale</span></div>
      <div class="mytime-details"><div><span class="lab">Session status</span><strong>${live?'In progress':'Not started'}</strong></div><div><span class="lab">Visible to you</span><strong>Recorded time and activity</strong></div></div>
      <p class="mytime-note">This is an interactive preview. Monitask is not recording your device or collecting screenshots.</p>
    </section>
    <section class="mytime-next"><div><b>What happens in a real workspace?</b><p>The desktop app records sessions after an employee connects it. Your timeline will show actual records once tracking begins.</p></div><a class="btn primary" href="#/dashboard">Continue setup</a></section>
  </div>`;
  clearInterval(window.__mytimeTimer);
  window.__mytimeTimer=setInterval(()=>{const x=document.querySelector('#myTimeClock');if(!x || App.current!=='mytime'){clearInterval(window.__mytimeTimer);return;}x.textContent=elapsed();const width=Math.min(96,Math.max(3,seconds()/3600*100));const fill=document.querySelector('.mytime-track-fill'),now=document.querySelector('.mytime-now');if(fill)fill.style.width=width+'%';if(now)now.style.left=width+'%';},1000);
}
App.route('mytime',renderMyTimeline);

// On narrow viewports, the prototype utility collapses to a small single control.
const protoUtility=document.querySelector('.proto');
if(protoUtility){
  const pToggle=document.createElement('button');
  pToggle.type='button';pToggle.id='protoToggle';pToggle.textContent='Prototype';
  pToggle.setAttribute('aria-expanded','false');pToggle.setAttribute('aria-label','Open prototype controls');
  protoUtility.prepend(pToggle);
  const setExpanded=(on)=>{protoUtility.classList.toggle('expanded',on);pToggle.setAttribute('aria-expanded',String(on));pToggle.setAttribute('aria-label',on?'Close prototype controls':'Open prototype controls');};
  pToggle.addEventListener('click',()=>setExpanded(!protoUtility.classList.contains('expanded')));
  document.addEventListener('click',(event)=>{if(!protoUtility.contains(event.target))setExpanded(false)});
  document.addEventListener('keydown',(event)=>{if(event.key==='Escape')setExpanded(false)});
}

/* After "Create workspace": a short, honest moment of setup before the Dashboard (about 1.5s; instant with reduced motion). */
function showCreating(company, done) {
  const card = document.querySelector('.ob-card'); if (!card) return done();
  const quick = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const steps = ['Creating your workspace', 'Applying private-by-default settings', 'Preparing your dashboard'];
  card.innerHTML = `<div class="creating" role="status" aria-live="polite"><h1>Setting up ${esc(company)}</h1><ul class="creating-steps">${steps.map(t => `<li><span class="cs-i" aria-hidden="true"></span>${t}</li>`).join('')}</ul></div>`;
  const items = [...card.querySelectorAll('.creating-steps li')];
  if (quick) { items.forEach(li => li.classList.add('done')); return setTimeout(done, 400); }
  items.forEach((li, i) => setTimeout(() => li.classList.add('done'), 300 + i * 380));
  setTimeout(done, 300 + items.length * 380 + 250);
}

App.start();
</script>
